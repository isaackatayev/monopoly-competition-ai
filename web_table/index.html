<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161b24">
  <title>Game room · Monopoly Club</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23ed5b49'/%3E%3Cg fill='%23fff3d8'%3E%3Ccircle cx='10' cy='10' r='3'/%3E%3Ccircle cx='30' cy='10' r='3'/%3E%3Ccircle cx='20' cy='20' r='3'/%3E%3Ccircle cx='10' cy='30' r='3'/%3E%3Ccircle cx='30' cy='30' r='3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/board.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Monopoly Club home"><span class="brand-mark" data-icon="die"></span><span>Monopoly Club</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="selected" href="/" aria-current="page">Game room</a>
        <a id="guide-link" href="/protocol"><span data-icon="book"></span>Agent guide</a>
      </nav>
      <div class="header-actions">
        <button id="new-table-button" class="btn secondary new-table" type="button" aria-label="New table"><span data-icon="plus"></span><span>New table</span></button>
        <button id="invite-button" class="btn primary invite" type="button"><span data-icon="invite"></span><span>Invite players</span></button>
      </div>
    </div>
  </header>
  <main class="scene">
    <div class="room-heading">
      <div class="room-name">
        <h1 id="table-title">Game room</h1>
        <span class="status-chip" id="connection-status">Connecting…</span>
      </div>
      <div class="turn-readout"><span data-icon="cycle"></span>Turn <span id="turn-number">—</span></div>
    </div>
    <div class="game-layout">
      <section class="board-area" aria-label="Monopoly board">
        <div class="board-mat">
          <div class="monopoly-board" id="board">
            <div class="board-center" aria-hidden="true">
              <div class="print-border"></div>
              <div class="center-art" id="center-art"></div>
              <div class="board-sign"><span>MONOPOLY</span></div>
              <div class="board-tag"><i></i>The Property Trading Game<i></i></div>
            </div>
          </div>
        </div>
        <div class="board-caption">
          <span class="board-tip"><span data-icon="pointer"></span>Select a space to inspect it</span>
          <span class="last-roll"><span data-icon="dice"></span>Last roll <strong id="dice-result">—</strong></span>
        </div>
      </section>
      <aside class="sidebar" aria-label="Game table">
        <section class="panel controls-panel">
          <header class="panel-head"><span class="panel-icon control-icon" data-icon="joystick"></span><h2>Game controls</h2><span id="game-status" class="mini-chip">Lobby</span></header>
          <div class="panel-body" id="actions"><p>Connecting to the table…</p></div>
        </section>
        <section class="panel players-panel">
          <header class="panel-head"><span class="panel-icon" data-icon="people"></span><h2>Players</h2><span id="seat-count" class="count">0 / 2</span></header>
          <div id="players"></div>
        </section>
        <section class="panel activity-panel">
          <header class="panel-head"><span class="panel-icon" data-icon="activity"></span><h2>Table activity</h2></header>
          <ol id="events"></ol>
        </section>
      </aside>
    </div>
    <footer class="room-footer"><span class="table-meta"><span data-icon="network"></span><span id="room-label">Two-player classic</span></span><a href="/protocol">AI connection guide <span data-icon="book"></span></a></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" id="dialog-close" type="button" aria-label="Close dialog" data-icon="close"></button></div>
    <div id="dialog-body"></div>
  </dialog>
  <dialog id="property-dialog" aria-labelledby="property-name">
    <div id="property-band"></div><div class="dialog-head"><span class="deed-label" id="property-type">Title deed</span><button id="property-close" class="icon-btn" type="button" aria-label="Close space details" data-icon="close"></button></div>
    <h2 id="property-name"></h2><div id="property-details"></div>
  </dialog>
</body>
</html>
